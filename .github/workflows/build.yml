name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch: {}

# برای ساخت Release در گیت‌هاب (فقط روی تگ‌های v*)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # این پروژه فایل gradlew را همراه ندارد، پس مستقیما از خود Gradle
      # (نسخه‌ی هم‌خوان با AGP 8.4.0) استفاده می‌کنیم.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # APKهای ریلز امضاشده با keystore اختصاصی Narcic MT:
      # برای هر پردازنده یک فایل + نسخهٔ universal
      - name: Build signed release APKs (per-ABI + universal)
        run: gradle assembleRelease --stacktrace

      # اثبات امضا در لاگ بیلد: باید CN=Narcic MT نشان دهد (نه Android Debug)
      - name: Verify release signature
        run: |
          for APK in app/build/outputs/apk/release/*.apk; do
            echo "== $(basename $APK) =="
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" | grep -E "Signer #1 certificate DN|SHA-256" || true
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsminer-monitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: narcic-mt-release-apk-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # انتشار رسمی در صفحهٔ Releases گیت‌هاب — فقط وقتی تگ v* پوش شود
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Narcic MT — نسخهٔ رسمی (امضاشده)

          APK ریلز با امضای اختصاصی **Narcic MT** (`CN=Narcic MT`) — نصب و به‌روزرسانی رسمی.

          ### کدام فایل برای کدام گوشی؟
          | فایل | مناسب برای |
          |---|---|
          | `universal` | همهٔ دستگاه‌ها (پیشنهادی) |
          | `arm64-v8a` | تقریباً همهٔ گوشی‌های جدید (۲۰۱۶ به بعد) |
          | `armeabi-v7a` | گوشی‌های قدیمی ۳۲بیتی |
          | `x86` / `x86_64` | شبیه‌سازها و تبلت‌های اینتلی |
          EOF
          gh release create "$TAG" \
            --title "Narcic MT $TAG" \
            --notes-file release-notes.md \
            app/build/outputs/apk/release/*.apk
