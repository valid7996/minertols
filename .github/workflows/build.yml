name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # این پروژه فایل gradlew را همراه ندارد، پس مستقیما از خود Gradle
      # (نسخه‌ی هم‌خوان با AGP 8.4.0) استفاده می‌کنیم.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # APK ریلز امضاشده (keystore داخل ریپو) — روی همه پردازنده‌ها نصب می‌شود
      # (arm64-v8a / armeabi-v7a / x86 / x86_64) چون برنامه کد نیتیو ندارد
      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whatsminer-monitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: narcic-mt-release-apk-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
